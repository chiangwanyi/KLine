<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>Vue3 + SVG K线绘图 Demo</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: #ccc;
            font-family: system-ui, sans-serif;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 160px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            padding: 10px;
        }

        .sidebar button {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            background: #222;
            border: 1px solid #333;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar button.active {
            background: #2962ff;
            border-color: #2962ff;
        }

        .chart-container {
            flex: 1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            background: #000;
            user-select: none;
        }

        /* 坐标轴样式 */
        .axis {
            stroke: #666;
            stroke-width: 1px;
        }

        .axis-text {
            font-size: 12px;
            fill: #999;
            user-select: none;
        }

        .grid-line {
            stroke: #333;
            stroke-width: 1px;
            stroke-dasharray: 2, 2;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 左侧工具栏 -->
        <div class="sidebar">
            <button 
                v-for="tool in toolOptions" 
                :key="tool.key" 
                :class="{ active: activeTool === tool.key }" 
                @click="switchTool(tool.key)"
            >
                {{ tool.label }}
            </button>
        </div>

        <!-- 右侧图表 -->
        <div class="chart-container">
            <svg 
                ref="svgRef" 
                @pointerdown="handlePointerDown" 
                @pointermove="handlePointerMove" 
                @pointerup="handlePointerUp"
                @pointerleave="handlePointerUp"
                @wheel="handleWheelZoom"
            >
                <!-- 网格线 -->
                <g>
                    <!-- 横向网格线（价格）- 与纵轴刻度对齐 -->
                    <line 
                        v-for="price in priceGridPoints" 
                        :key="'h-' + price"
                        class="grid-line"
                        :x1="chartConfig.padding.left" 
                        :y1="getYCoordinate(price)" 
                        :x2="svgSize.width - chartConfig.padding.right" 
                        :y2="getYCoordinate(price)"
                    />
                    <!-- 纵向网格线（时间）- 与横轴刻度/K线对齐 -->
                    <line 
                        v-for="idx in timeGridIndexs" 
                        :key="'v-' + idx"
                        class="grid-line"
                        :x1="getXCoordinate(idx)" 
                        :y1="chartConfig.padding.top" 
                        :x2="getXCoordinate(idx)" 
                        :y2="svgSize.height - chartConfig.padding.bottom"
                    />
                </g>

                <!-- 坐标轴 -->
                <g>
                    <!-- 纵轴（价格） -->
                    <line 
                        class="axis"
                        :x1="chartConfig.padding.left" 
                        :y1="chartConfig.padding.top" 
                        :x2="chartConfig.padding.left" 
                        :y2="svgSize.height - chartConfig.padding.bottom"
                    />
                    <!-- 纵轴刻度文本 - 保留2位小数 -->
                    <text 
                        v-for="price in priceGridPoints" 
                        :key="'price-' + price"
                        class="axis-text"
                        :x="chartConfig.padding.left - 8" 
                        :y="getYCoordinate(price) + 4"
                        text-anchor="end"
                    >
                        {{ price.toFixed(2) }}
                    </text>

                    <!-- 横轴（时间） -->
                    <line 
                        class="axis"
                        :x1="chartConfig.padding.left" 
                        :y1="svgSize.height - chartConfig.padding.bottom" 
                        :x2="svgSize.width - chartConfig.padding.right" 
                        :y2="svgSize.height - chartConfig.padding.bottom"
                    />
                    <!-- 横轴刻度文本 - 与K线/网格线严格对齐 -->
                    <text 
                        v-for="idx in timeGridIndexs" 
                        :key="'time-' + idx"
                        class="axis-text"
                        :x="getXCoordinate(idx)" 
                        :y="svgSize.height - chartConfig.padding.bottom + 16"
                        text-anchor="middle"
                    >
                        {{ visibleKLineData[idx].time }}
                    </text>
                </g>

                <!-- K线层 - 索引为key，保证和坐标计算一致 -->
                <g>
                    <template v-for="(bar, index) in visibleKLineData" :key="index">
                        <!-- 影线 - 与X坐标计算完全绑定 -->
                        <line 
                            :x1="getXCoordinate(index)" 
                            :x2="getXCoordinate(index)" 
                            :y1="getYCoordinate(bar.high)" 
                            :y2="getYCoordinate(bar.low)"
                            :stroke="bar.close >= bar.open ? colorConfig.up : colorConfig.down" 
                        />
                        <!-- 实体 - 居中对齐，宽度固定 -->
                        <rect 
                            :x="getXCoordinate(index) - chartConfig.candleWidth / 2" 
                            :y="Math.min(getYCoordinate(bar.open), getYCoordinate(bar.close))"
                            :width="chartConfig.candleWidth" 
                            :height="Math.max(1, Math.abs(getYCoordinate(bar.close) - getYCoordinate(bar.open)))"
                            :fill="bar.close >= bar.open ? colorConfig.up : colorConfig.down" 
                        />
                    </template>
                </g>

                <!-- 绘图层 -->
                <g>
                    <!-- 趋势线 -->
                    <g v-for="(line, idx) in drawingData.trendLines" :key="idx">
                        <line 
                            :x1="line.p1.x" 
                            :y1="line.p1.y" 
                            :x2="line.p2.x" 
                            :y2="line.p2.y" 
                            stroke="#2962ff" 
                            stroke-width="2" 
                        />
                        <circle 
                            v-for="(point, i) in [line.p1, line.p2]" 
                            :key="i" 
                            :cx="point.x" 
                            :cy="point.y" 
                            r="5" 
                            fill="#fff"
                            stroke="#2962ff" 
                            @pointerdown.stop="startDragTrendLine(line, i, $event)"
                        />
                    </g>

                    <!-- 已绘制矩形 -->
                    <rect 
                        v-for="(rect, idx) in drawingData.rects" 
                        :key="idx" 
                        :x="rect.x" 
                        :y="rect.y" 
                        :width="rect.w" 
                        :height="rect.h"
                        fill="rgba(41,98,255,0.15)" 
                        stroke="#2962ff" 
                    />

                    <!-- 临时绘制矩形 -->
                    <rect 
                        v-if="drawingData.tempRect" 
                        :x="drawingData.tempRect.x" 
                        :y="drawingData.tempRect.y" 
                        :width="drawingData.tempRect.w" 
                        :height="drawingData.tempRect.h"
                        fill="rgba(41,98,255,0.15)" 
                        stroke="#2962ff" 
                    />
                </g>
            </svg>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, onUnmounted } = Vue

        createApp({
            setup() {
                /**************************
                 * 1. 常量配置（集中管理）
                 *************************/
                const chartConfig = {
                    padding: { left: 60, right: 20, top: 20, bottom: 30 }, // 坐标轴预留空间
                    candleWidth: 6,
                    barCount: 288, // 总K线数量（5分钟级，模拟交易日）
                    grid: {
                        priceCount: 8, // 价格网格/刻度数量
                        timeCount: 10   // 时间网格/刻度数量（可视区最多显示）
                    },
                    zoom: {
                        minScale: 0.5,  // 最小缩放比例
                        maxScale: 3,    // 最大缩放比例
                        step: 0.1       // 缩放步长
                    }
                }

                // 颜色配置
                const colorConfig = {
                    up: '#4CAF50',   // 涨-绿色
                    down: '#F44336', // 跌-红色
                    drawing: '#2962ff' // 绘图-蓝色
                }

                // 工具选项
                const toolOptions = [
                    { key: 'view', label: '查看' },
                    { key: 'trend', label: '趋势线' },
                    { key: 'rect', label: '矩形' },
                ]

                /**************************
                 * 2. 响应式数据（分类管理）
                 *************************/
                const activeTool = ref('view')
                const svgRef = ref(null)
                const svgSize = ref({ width: 0, height: 0 })

                // 缩放相关
                const zoomScale = ref(1.0) // 缩放比例（影响K线横向间距）

                // K线数据 - 带时间标签，后续可替换为真实行情数据
                const kLineData = ref([])
                const priceRange = ref({ min: 0, max: 0 })

                // 可视区域K线（缩放后动态调整，取最后N个，模拟行情从左到右）
                const visibleKLineData = computed(() => {
                    if (kLineData.value.length === 0) return []
                    // 缩放越大，可视K线越少，保证K线不会挤在一起
                    const visibleCount = Math.min(
                        chartConfig.barCount,
                        Math.floor(chartConfig.barCount / zoomScale.value)
                    )
                    return kLineData.value.slice(-visibleCount)
                })

                // 价格网格/刻度点 - 均匀分布在价格极值之间
                const priceGridPoints = computed(() => {
                    const { min, max } = priceRange.value
                    if (max === min) return [min]
                    const step = (max - min) / (chartConfig.grid.priceCount - 1)
                    return Array.from({ length: chartConfig.grid.priceCount }, (_, i) => min + i * step)
                })

                // 时间网格/刻度索引 - 核心：和可视K线索引严格绑定，保证对齐
                const timeGridIndexs = computed(() => {
                    const len = visibleKLineData.value.length
                    if (len === 0) return []
                    // 计算步长，保证时间刻度数量不超过配置的timeCount
                    const step = Math.max(1, Math.floor(len / chartConfig.grid.timeCount))
                    // 生成索引数组，最后一个索引必选（保证刻度到最右侧）
                    const indexs = Array.from({ length: Math.ceil(len / step) }, (_, i) => i * step)
                    if (indexs[indexs.length - 1] !== len - 1) {
                        indexs[Math.max(0, indexs.length - 1)] = len - 1
                    }
                    return indexs
                })

                // 绘图相关数据（保留原有功能）
                const drawingData = ref({
                    trendLines: [],
                    tempTrendLine: null,
                    rects: [],
                    tempRect: null,
                    rectStartPoint: null,
                    dragging: null
                })

                /**************************
                 * 3. 工具函数（通用能力）
                 *************************/
                // 生成带时间的K线数据 - 5分钟级，格式：HH:MM，保证时间连续
                const generateKLineData = () => {
                    let price = 100
                    const data = []
                    // 模拟交易日开始时间：09:30（A股开盘时间，更贴合实际）
                    const startHour = 9
                    const startMin = 30
                    const totalMinutes = chartConfig.barCount * 5

                    for (let i = 0; i < chartConfig.barCount; i++) {
                        // 计算当前分钟数，处理小时/分钟进位
                        const currentTotalMin = startHour * 60 + startMin + i * 5
                        const hour = Math.floor(currentTotalMin / 60).toString().padStart(2, '0')
                        const min = (currentTotalMin % 60).toString().padStart(2, '0')
                        const timeStr = `${hour}:${min}`

                        // 生成随机K线价格（保留波动，无跳空）
                        const open = price
                        const high = open + Math.random() * 2
                        const low = open - Math.random() * 2
                        const close = low + Math.random() * (high - low)
                        price = close

                        data.push({ time: timeStr, open, high, low, close })
                    }
                    return data
                }

                // 更新SVG尺寸
                const updateSvgSize = () => {
                    if (svgRef.value) {
                        svgSize.value.width = svgRef.value.clientWidth
                        svgSize.value.height = svgRef.value.clientHeight
                    }
                }

                // 计算价格极值（所有K线的最高/最低，保证纵轴稳定）
                const calculatePriceRange = (data) => {
                    return {
                        min: Math.min(...data.map(bar => bar.low)),
                        max: Math.max(...data.map(bar => bar.high))
                    }
                }

                /**************************
                 * 4. 坐标计算（核心：单入口，K线/时间/网格共用）
                 *************************/
                // 唯一X坐标计算函数 - 所有K线/时间刻度/纵向网格都用这个，保证100%对齐
                const getXCoordinate = (index) => {
                    const { width } = svgSize.value
                    const len = visibleKLineData.value.length
                    if (!width || len === 0) return chartConfig.padding.left
                    // 有效绘图宽度：扣除左右内边距
                    const validWidth = width - chartConfig.padding.left - chartConfig.padding.right
                    // 单根K线的横向步长：加入缩放比例，缩放影响间距
                    const step = (validWidth / Math.max(1, len - 1)) * zoomScale.value
                    // 基准左内边距 + 索引*步长 = 每个K线的中心X坐标
                    return chartConfig.padding.left + index * step
                }

                // Y坐标计算（价格转SVG坐标，SVG-Y轴向下，价格越高Y越小）
                const getYCoordinate = (price) => {
                    const { height } = svgSize.value
                    const { min, max } = priceRange.value
                    if (!height || max === min) return chartConfig.padding.top
                    // 有效绘图高度：扣除上下内边距
                    const validHeight = height - chartConfig.padding.top - chartConfig.padding.bottom
                    // 价格归一化后映射到有效高度
                    return chartConfig.padding.top + (max - price) / (max - min) * validHeight
                }

                /**************************
                 * 5. 鼠标滚轮缩放（优化：仅影响K线横向间距，不改变价格轴）
                 *************************/
                const handleWheelZoom = (e) => {
                    e.preventDefault() // 阻止浏览器默认滚动
                    // 滚轮向上：放大（K线间距变大），向下：缩小（K线间距变小）
                    const delta = e.deltaY > 0 ? -chartConfig.zoom.step : chartConfig.zoom.step
                    const newScale = zoomScale.value + delta
                    // 限制缩放范围，避免过度缩放导致异常
                    zoomScale.value = Math.max(chartConfig.zoom.minScale, Math.min(chartConfig.zoom.maxScale, newScale))
                }

                /**************************
                 * 6. 原有绘图功能（趋势线/矩形，无改动，保证兼容）
                 *************************/
                const switchTool = (toolKey) => {
                    activeTool.value = toolKey
                    drawingData.value.tempTrendLine = null
                    drawingData.value.tempRect = null
                    drawingData.value.rectStartPoint = null
                }

                const startDragTrendLine = (line, pointIndex, e) => {
                    drawingData.value.dragging = { line, pointIndex }
                    svgRef.value.setPointerCapture(e.pointerId)
                }

                const drawTrendLine = (event) => {
                    const { tempTrendLine, trendLines } = drawingData.value
                    const point = { x: event.offsetX, y: event.offsetY }
                    if (!tempTrendLine) {
                        drawingData.value.tempTrendLine = { p1: point }
                    } else {
                        trendLines.push({ ...tempTrendLine, p2: point })
                        drawingData.value.tempTrendLine = null
                    }
                }

                const startDrawRect = (event) => {
                    const startPoint = { x: event.offsetX, y: event.offsetY }
                    drawingData.value.rectStartPoint = startPoint
                    drawingData.value.tempRect = { x: startPoint.x, y: startPoint.y, w: 0, h: 0 }
                }

                const updateTempRect = (event) => {
                    const { rectStartPoint, tempRect } = drawingData.value
                    if (!rectStartPoint || !tempRect) return
                    drawingData.value.tempRect = {
                        x: Math.min(rectStartPoint.x, event.offsetX),
                        y: Math.min(rectStartPoint.y, event.offsetY),
                        w: Math.abs(event.offsetX - rectStartPoint.x),
                        h: Math.abs(event.offsetY - rectStartPoint.y)
                    }
                }

                const finishDrawRect = () => {
                    const { tempRect, rects } = drawingData.value
                    if (tempRect && tempRect.w > 0 && tempRect.h > 0) {
                        rects.push({ ...tempRect })
                    }
                    drawingData.value.tempRect = null
                    drawingData.value.rectStartPoint = null
                }

                /**************************
                 * 7. 指针事件处理（原有逻辑，无改动）
                 *************************/
                const handlePointerDown = (event) => {
                    if (activeTool.value === 'view') return
                    activeTool.value === 'trend' && drawTrendLine(event)
                    activeTool.value === 'rect' && startDrawRect(event)
                }

                const handlePointerMove = (event) => {
                    // 趋势线拖拽
                    if (drawingData.value.dragging) {
                        const { line, pointIndex } = drawingData.value.dragging
                        const key = pointIndex === 0 ? 'p1' : 'p2'
                        line[key] = { x: event.offsetX, y: event.offsetY }
                    }
                    // 矩形绘制中更新
                    activeTool.value === 'rect' && drawingData.value.tempRect && updateTempRect(event)
                }

                const handlePointerUp = () => {
                    drawingData.value.dragging = null
                    activeTool.value === 'rect' && finishDrawRect()
                }

                /**************************
                 * 8. 生命周期（初始化/销毁）
                 *************************/
                onMounted(() => {
                    // 初始化K线数据和价格极值
                    kLineData.value = generateKLineData()
                    priceRange.value = calculatePriceRange(kLineData.value)
                    // 初始化SVG尺寸
                    updateSvgSize()
                    // 监听窗口缩放，自适应图表
                    window.addEventListener('resize', updateSvgSize)
                })

                onUnmounted(() => {
                    // 移除监听，避免内存泄漏
                    window.removeEventListener('resize', updateSvgSize)
                })

                /**************************
                 * 9. 暴露给模板的变量/方法
                 *************************/
                return {
                    chartConfig, colorConfig, toolOptions,
                    activeTool, svgRef, svgSize,
                    visibleKLineData, priceGridPoints, timeGridIndexs,
                    drawingData, zoomScale,
                    switchTool, getXCoordinate, getYCoordinate,
                    startDragTrendLine,
                    handlePointerDown, handlePointerMove, handlePointerUp,
                    handleWheelZoom
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
